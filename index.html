<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Chess Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CHESS ENGINE (STABLE) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #020617, #000);
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: grid;
      grid-template-columns: auto 280px;
      gap: 20px;
      padding: 20px;
    }

    h1 { margin: 0 0 12px; }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 64px);
      grid-template-rows: repeat(8, 64px);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,.7);
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      cursor: pointer;
      user-select: none;
    }

    .light { background: #f8fafc; color: #020617; }
    .dark  { background: #94a3b8; }

    .selected { outline: 4px solid #ef4444; }
    .hint { background: #22c55e !important; }

    .side {
      background: rgba(255,255,255,.05);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select {
      background: #2563eb;
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
    }

    .status, .elo {
      font-size: 14px;
      opacity: .9;
    }

    .moves {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      background: rgba(0,0,0,.35);
      border-radius: 10px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div>
    <h1>♟️ Ultimate Chess Pro</h1>
    <div class="board" id="board"></div>
  </div>

  <div class="side">
    <div class="elo" id="elo"></div>

    <div class="controls">
      <button onclick="resetGame()">Reset</button>
      <button onclick="undoMove()">Undo</button>
      <select onchange="setDifficulty(this.value)">
        <option value="2">Easy</option>
        <option value="3" selected>Medium</option>
        <option value="4">Hard</option>
      </select>
    </div>

    <div class="status" id="status"></div>
    <div class="moves" id="moves"></div>
  </div>

<script>
  const game = new Chess();
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const movesEl = document.getElementById('moves');
  const eloEl = document.getElementById('elo');

  let selected = null;
  let hints = [];
  let depth = 3;

  let elo = Number(localStorage.getItem('elo')) || 1200;

  const values = { p:10, n:30, b:30, r:50, q:90, k:900 };
  const icons = {
    p:'♟', r:'♜', n:'♞', b:'♝', q:'♛', k:'♚',
    P:'♙', R:'♖', N:'♘', B:'♗', Q:'♕', K:'♔'
  };

  function draw() {
    boardEl.innerHTML = '';
    const board = game.board();

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const sq = document.createElement('div');
        const name = 'abcdefgh'[c] + (8 - r);
        sq.className = 'square ' + ((r + c) % 2 ? 'dark' : 'light');

        if (selected === name) sq.classList.add('selected');
        if (hints.includes(name)) sq.classList.add('hint');

        const piece = board[r][c];
        if (piece) {
          sq.textContent = icons[piece.color === 'w'
            ? piece.type.toUpperCase()
            : piece.type];
        }

        sq.onclick = () => clickSquare(name);
        boardEl.appendChild(sq);
      }
    }

    renderMoves();
    updateStatus();
    eloEl.textContent = `ELO: ${elo}`;
  }

  function clickSquare(square) {
    if (selected) {
      const move = game.move({ from: selected, to: square, promotion: 'q' });
      selected = null;
      hints = [];

      if (move && !game.game_over()) {
        setTimeout(aiMove, 200);
      }
    } else {
      const p = game.get(square);
      if (p && p.color === game.turn()) {
        selected = square;
        hints = game.moves({ square, verbose: true }).map(m => m.to);
      }
    }
    draw();
  }

  function evaluate() {
    let score = 0;
    game.board().flat().forEach(p => {
      if (!p) return;
      score += (p.color === 'w' ? 1 : -1) * values[p.type];
    });
    return score;
  }

  function minimax(d, alpha, beta, isMax) {
    if (d === 0 || game.game_over()) return evaluate();
    const moves = game.moves();

    if (isMax) {
      let max = -Infinity;
      for (const m of moves) {
        game.move(m);
        const val = minimax(d-1, alpha, beta, false);
        game.undo();
        max = Math.max(max, val);
        alpha = Math.max(alpha, val);
        if (beta <= alpha) break;
      }
      return max;
    } else {
      let min = Infinity;
      for (const m of moves) {
        game.move(m);
        const val = minimax(d-1, alpha, beta, true);
        game.undo();
        min = Math.min(min, val);
        beta = Math.min(beta, val);
        if (beta <= alpha) break;
      }
      return min;
    }
  }

  function aiMove() {
    let bestScore = Infinity;
    let bestMove;

    for (const m of game.moves()) {
      game.move(m);
      const score = minimax(depth-1, -Infinity, Infinity, true);
      game.undo();
      if (score < bestScore) {
        bestScore = score;
        bestMove = m;
      }
    }

    game.move(bestMove);
    draw();
  }

  function renderMoves() {
    movesEl.innerHTML = game.history().map((m,i) => `${i+1}. ${m}`).join('<br>');
  }

  function undoMove() {
    game.undo();
    game.undo();
    draw();
  }

  function setDifficulty(d) {
    depth = Number(d);
  }

  function resetGame() {
    if (game.in_checkmate()) {
      elo += game.turn() === 'w' ? -20 : 20;
      localStorage.setItem('elo', elo);
    }
    game.reset();
    selected = null;
    hints = [];
    draw();
  }

  function updateStatus() {
    if (game.in_checkmate()) statusEl.textContent = 'Checkmate';
    else if (game.in_draw()) statusEl.textContent = 'Draw';
    else if (game.in_check()) statusEl.textContent = 'Check';
    else statusEl.textContent = 'Turn: ' + (game.turn() === 'w' ? 'White' : 'Black');
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  draw();
</script>
</body>
</html>
